name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Run MCP and orchestrator tests
        run: uv run pytest tests/ --ignore=tests/test_agent_skills_client.py --ignore=tests/test_agent_skills_operations.py --ignore=tests/test_agent_skills_samples.py --ignore=tests/test_agent_skills_search.py --ignore=tests/test_agent_skills_evaluate.py --ignore=tests/test_agent_skills_preflight.py --ignore=tests/test_agent_skills_standalone_assets.py -v
      - name: Verify version consistency
        run: uv run python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); import opensearch_orchestrator as pkg; assert p['project']['version'] == pkg.__version__, f'mismatch {p[\"project\"][\"version\"]} vs {pkg.__version__}'; print('version OK:', pkg.__version__)"
      - name: Build and verify artifacts
        run: |
          uv build
          for whl in dist/*.whl; do python -m zipfile -l "$whl"; done
      - name: Verify entry point import
        run: uv run python -c "import opensearch_orchestrator.mcp_server as m; print(hasattr(m, 'main'))"

  test-macos:
    name: Test on macOS
    runs-on: macOS-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Run MCP and orchestrator tests
        run: uv run pytest tests/ --ignore=tests/test_agent_skills_client.py --ignore=tests/test_agent_skills_operations.py --ignore=tests/test_agent_skills_samples.py --ignore=tests/test_agent_skills_search.py --ignore=tests/test_agent_skills_evaluate.py --ignore=tests/test_agent_skills_preflight.py --ignore=tests/test_agent_skills_standalone_assets.py -v
      - name: Build and verify artifacts
        run: |
          uv build
          for whl in dist/*.whl; do python -m zipfile -l "$whl"; done

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install UV
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Run MCP and orchestrator tests
        shell: pwsh
        run: uv run pytest tests/ --ignore=tests/test_agent_skills_client.py --ignore=tests/test_agent_skills_operations.py --ignore=tests/test_agent_skills_samples.py --ignore=tests/test_agent_skills_search.py --ignore=tests/test_agent_skills_evaluate.py --ignore=tests/test_agent_skills_preflight.py --ignore=tests/test_agent_skills_standalone_assets.py -v
      - name: Build and verify artifacts
        shell: pwsh
        run: uv build

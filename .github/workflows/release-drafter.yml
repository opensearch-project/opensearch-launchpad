name: Release Workflow

on:
  push:
    tags:
      - "*"

jobs:
  release-to-pypi:
    environment: release-approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: github.repository == 'opensearch-project/opensearch-launchpad'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Build with Python
        run: |
          pip install uv
          uv run pytest -q
          uv run python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); import opensearch_orchestrator as pkg; print('pyproject=', p['project']['version'], 'package=', pkg.__version__)"

          uv build
          for whl in dist/*.whl; do python -m zipfile -l "$whl"; done
          uv run python -c "import opensearch_orchestrator.mcp_server as m; print(hasattr(m, 'main'))"

          VERSION=`cat pyproject.toml | grep "version =" | grep -Eo "[0-9.]+"`
          WHEEL_PATH="$(ls dist/opensearch_launchpad-${VERSION}-*.whl 2>/dev/null || ls dist/opensearch_orchestrator-${VERSION}-*.whl)"
          uvx --from "$WHEEL_PATH" opensearch-launchpad

          mkdir -p release-wheel
          cp -v $WHEEL_PATH release-wheel/
          wheel_name=`ls release-wheel/`
          echo "WHEEL_NAME=$wheel_name" >> $GITHUB_ENV

      - name: Publish python artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

      - name: Release on Github
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          generate_release_notes: true
          files: release-wheel/${{ env.WHEEL_NAME }}
